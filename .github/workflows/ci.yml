name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LEX1DX_AGREE_DIR: /tmp/lex1dx-agree
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Configure and build (C++)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
      - name: Test (C++, also writes the agreement dump)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test (Scala)
        working-directory: scala
        run: sbt -batch test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and test (Python)
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
          pytest

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install Rcpp and testthat
        run: install.packages(c("Rcpp", "testthat"))
        shell: Rscript {0}
      - name: Build and check (R)
        working-directory: r
        run: |
          sh tools/sync_core.sh
          R CMD build .
          R CMD check --no-manual --no-vignettes lex1dx_0.1.0.tar.gz
