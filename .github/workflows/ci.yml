name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  cpp-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j 4
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  scala:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set agreement dump directory
        shell: bash
        run: echo "LEX1DX_AGREE_DIR=$RUNNER_TEMP/lex1dx-agree" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Build C++ agreement dump
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target test_agree -j 4
          ctest --test-dir build -C Release -R agree --output-on-failure
      - name: Test (Scala)
        working-directory: scala
        run: sbt -batch test

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -c "import lex1dx; x=lex1dx.datasets.load('athletics20'); assert x.shape==(20,)"
          python -m pytest -q
      - name: Install matplotlib and retest histogram
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install matplotlib
          python -m pytest -q
      - name: Verify sdist self-containment
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist-sdist
          python -m pip install --force-reinstall --no-deps dist-sdist/lex1dx-*.tar.gz
          python -c "import lex1dx; x=lex1dx.datasets.load('athletics20'); assert x.shape==(20,)"
          python -m pytest -q

  r:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      _R_CHECK_FORCE_SUGGESTS_: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Sync C++ core into r/src
        working-directory: r
        shell: bash
        run: sh tools/sync_core.sh
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
